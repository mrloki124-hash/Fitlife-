<section class="section" id="contact">
    <div class="section-heading">
        <small>Get In Touch</small>
        <h2>Let's Start Training.</h2>
    </div>

    <div class="contact-grid">
        <div class="contact-info">
            <h3>Visit FitLife</h3>
            <p>Have questions about memberships, personal training or classes? Send us a message.</p>

            <div class="contact-item">
                <small>ADDRESS</small>
                <a class="contact-link" href="https://www.google.com/maps/dir/?api=1&amp;destination=InFront%20Of%20Power%20Pata%20RailWay%20Station%2C%20Eluru%2C%20Andhra%20Pradesh%2C%20India" target="_blank" rel="noopener" aria-label="Get directions to FitLife in Eluru">
                    InFront Of Power Pata RailWay Station, Eluru
                </a>
            </div>

            <div class="contact-item">
                <small>PHONE</small>
                <a class="contact-link" href="tel:+919493497153" aria-label="Call FitLife at plus 91 94934 97153">+91 94934 97153</a>
            </div>

            <div class="contact-item">
                <small>EMAIL</small>
                <a class="contact-link" href="mailto:fitlife@gmail.com" aria-label="Email FitLife at fitlife@gmail.com">fitlife@gmail.com</a>
            </div>

            <div class="contact-item">
                <small>OPENING HOURS</small>
                Monday – Sunday • 24/7
            </div>
        </div>

        <form class="contact-form" id="feedbackForm" action="#">
            <center>
            <h3>Feedback</h3>
            </center>
            <div class="form-grid">
                <input type="text" name="Name" placeholder="Your Name" aria-label="Feedback Name" autocomplete="name" required>
                <input type="tel" name="phone" placeholder="Phone Number" aria-label="Phone Number" autocomplete="tel" inputmode="tel">
                <input type="email" name="email" placeholder="Email Address" aria-label="Email Address" autocomplete="email">
                <select name="service" aria-label="Select Service" required>
                    <option value="" selected disabled>Select Service</option>
                    <option>Membership</option>
                    <option>Personal Training</option>
                    <option>Group Classes</option>
                    <option>Nutrition Guidance</option>
                </select>
                <textarea class="form-full" name="message" placeholder="Your Message" aria-label="Your Message" rows="6" required></textarea>
                <p id="feedbackStatus" class="form-status" role="status" aria-live="polite"></p>
                <button type="submit" class="btn btn-primary form-full">SEND MESSAGE</button>
            </div>
        </form>
    </div>
</section>
