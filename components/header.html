<header class="navbar">
    <div class="nav-inner">
        <a href="#home" class="logo" aria-label="FitLife home">
            <img src="assets/logo.png" alt="FitLife Modern Gym & Fitness Center" class="logo-image">
        </a>

        <button class="mobile-menu-btn" type="button" aria-label="Open navigation menu" aria-expanded="false" aria-controls="main-navigation">
            <span></span><span></span><span></span>
        </button>

        <nav class="nav-links" id="main-navigation" aria-label="Main navigation">
            <a href="#about">About</a>
            <a href="#services">Services</a>
            <a href="#protein">Protein</a>
            <a href="#classes">Classes</a>
            <a href="#trainers">Trainers</a>
            <a href="#membership">Membership</a>
            <a href="#contact">Contact</a>
        </nav>

        <div class="nav-actions" aria-label="Website actions">
            <!-- Search feature inspired by the reference header -->
            <button class="header-tool-btn search-btn" type="button" aria-label="Open search" aria-expanded="false" aria-controls="header-search-panel">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                    <circle cx="11" cy="11" r="6.5"></circle>
                    <path d="M16 16l5 5"></path>
                </svg>
            </button>

            <!-- Cart feature inspired by the reference header -->
            <button class="header-tool-btn cart-btn" type="button" aria-label="Open membership cart" aria-expanded="false" aria-controls="cart-panel">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M3 4h2l2.1 10.2a2 2 0 0 0 2 1.6h7.8a2 2 0 0 0 1.9-1.4L21 8H6"></path>
                    <circle cx="10" cy="20" r="1.3"></circle>
                    <circle cx="18" cy="20" r="1.3"></circle>
                </svg>
                <span class="cart-count" aria-label="0 items in cart">0</span>
            </button>

            <label for="theme-toggle" class="theme-switch" title="Toggle light/dark mode" aria-label="Toggle light/dark mode">
                <span class="theme-moon" aria-hidden="true">☾</span>
                <span class="theme-sun" aria-hidden="true">☀</span>
            </label>

            <a href="#membership" class="nav-cta">JOIN NOW</a>
        </div>

        <div class="header-search-panel" id="header-search-panel" hidden>
            <label for="site-search" class="sr-only">Search FitLife</label>
            <div class="search-input-wrap">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                    <circle cx="11" cy="11" r="6.5"></circle>
                    <path d="M16 16l5 5"></path>
                </svg>
                <input id="site-search" type="search" placeholder="Search services, classes, trainers..." autocomplete="off">
                <button type="button" class="search-close" aria-label="Close search">×</button>
            </div>
            <div class="search-results" aria-live="polite"></div>
        </div>

        <aside class="cart-panel" id="cart-panel" hidden aria-label="Membership cart">
            <div class="cart-panel-head">
                <h3>Your Cart</h3>
                <button type="button" class="cart-close" aria-label="Close cart">×</button>
            </div>
            <div class="cart-empty">
                <div class="cart-empty-icon" aria-hidden="true">🛒</div>
                <p>Your cart is empty.</p>
                <span>Select a membership plan to get started.</span>
                <a href="#membership" class="btn btn-primary cart-membership-link">VIEW MEMBERSHIP PLANS</a>
            </div>
        </aside>
    </div>
</header>
